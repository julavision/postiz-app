<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6A45B0"/>
      <stop offset="0.5" stop-color="#3F8FCB"/>
      <stop offset="1" stop-color="#0E8F6E"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A8BC8"/>
      <stop offset="1" stop-color="#0E8F6E"/>
    </linearGradient>
  </defs>

  <rect width="560" height="120" fill="#0f0f12"/>
  <g>
    <!-- bracket frame, open where the plane exits (top-right) -->
    <path d="M8 40 V8 H52" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="square"/>
    <path d="M8 80 V112 H96" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="square"/>
    <!-- the X: full backslash arm + lower-left half of the slash arm -->
    <path d="M24 28 L88 92" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="square"/>
    <path d="M24 92 L54 62" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="square"/>
    <!-- upper-right arm becomes the paper plane leaving the frame -->
    <path d="M110 12 L56 46 L74 56 L82 76 Z" fill="url(#g)"/>
    <path d="M74 56 L110 12" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
</g>
  <text x="140" y="52" font-family="Inter Tight, Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#ffffff">XPERIENCE</text>
  <text x="140" y="104" font-family="Inter Tight, Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" letter-spacing="6" fill="url(#t)">POST</text>
</svg>