name: "Xperience Post image"

# Builds the branded image from the xperience-post branch and publishes it to
# ghcr.io/julavision/xperience-post. amd64 only — that is what the VPS runs.
on:
  workflow_dispatch:
  push:
    branches: [xperience-post]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          NEXT_PUBLIC_VERSION: xp-${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --provenance=false --sbom=false \
            -t ghcr.io/julavision/xperience-post:latest \
            -t ghcr.io/julavision/xperience-post:${{ github.sha }} \
            --push .
